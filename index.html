!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Silicon Suite | Premium Domains</title>
  <meta name="description" content="SiliconOptima • SiliconOmni • SiliconFold — Premium domain suite for next-gen compute, intelligence and molecular AI.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #03050a;
      --card: #0a0e17;
      --turquoise: #00e5c7;
      --turquoise-dim: #00b8a0;
      --blue: #3b82f6;
      --yellow: #fbbf24;
      --text: #e8f0ff;
      --muted: #8b9bb8;
      --border: rgba(0, 229, 199, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 229, 199, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
      background-size: 70px 70px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* HERO */
    .hero {
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px 60px;
    }

    .badge {
      display: inline-block;
      background: rgba(0, 229, 199, 0.1);
      border: 1px solid rgba(0, 229, 199, 0.3);
      color: var(--turquoise);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      padding: 8px 18px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.4rem, 6.5vw, 3.9rem);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 18px;
      line-height: 1.1;
    }

    h1 .accent {
      background: linear-gradient(90deg, #00e5c7, #3b82f6, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      color: var(--muted);
      max-width: 680px;
      margin: 0 auto 40px;
    }

    .tagline strong { color: var(--text); font-weight: 500; }

    .hero-cta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00e5c7, #00b8a0);
      color: #02120f;
      box-shadow: 0 8px 28px rgba(0, 229, 199, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(0, 229, 199, 0.45);
    }

    .btn-outline {
      background: transparent;
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }

    .btn-outline:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: #3b82f6;
    }

    .btn-sm {
      padding: 11px 18px;
      font-size: 0.86rem;
      border-radius: 10px;
    }

    /* SECTIONS */
    section { padding: 90px 0; }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.65rem;
      text-align: center;
      margin-bottom: 12px;
    }

    .section-sub {
      text-align: center;
      color: var(--muted);
      max-width: 640px;
      margin: 0 auto 52px;
      font-size: 1.05rem;
    }

    /* DOMAIN CARDS */
    .domains {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 28px;
    }

    .domain-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 32px 28px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .domain-card:hover {
      border-color: rgba(0, 229, 199, 0.45);
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .domain-number {
      font-size: 13px;
      font-weight: 600;
      color: var(--turquoise);
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .domain-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.35rem;
      margin-bottom: 8px;
    }

    .domain-name span { color: var(--turquoise); }

    .domain-tagline {
      color: var(--yellow);
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .domain-desc {
      color: var(--muted);
      font-size: 0.95rem;
      flex-grow: 1;
      margin-bottom: 24px;
    }

    .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 18px;
    }

    .price span {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 400;
    }

    .card-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-sedo {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }

    .btn-afternic {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #1a1200;
    }

    .btn-sedo:hover, .btn-afternic:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    /* ADVANTAGE */
    .advantage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .adv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
    }

    .adv-card h3 {
      font-size: 1.05rem;
      margin-bottom: 10px;
      color: var(--turquoise);
    }

    .adv-card p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* CTA BOX */
    .cta-box {
      background: linear-gradient(135deg, rgba(0, 229, 199, 0.08), rgba(59, 130, 246, 0.08));
      border: 1px solid rgba(0, 229, 199, 0.25);
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      margin-top: 20px;
    }

    .cta-box h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      margin-bottom: 14px;
    }

    .cta-box p {
      color: var(--muted);
      max-width: 520px;
      margin: 0 auto 28px;
    }

    footer {
      text-align: center;
      padding: 40px 20px 60px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    @media (max-width: 640px) {
      .domain-card { padding: 26px 22px; }
      .card-buttons { flex-direction: column; }
      .btn-sm { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="container">
      <div class="badge">Premium Domain Portfolio</div>
      <h1>The <span class="accent">Silicon</span> Suite</h1>
      <p class="tagline">
        Three premium domains built for the next era of compute and intelligence.<br>
        <strong>SiliconOptima</strong> optimizes. <strong>SiliconOmni</strong> powers. <strong>SiliconFold</strong> unfolds.
      </p>
      <div class="hero-cta">
        <a href="#domains" class="btn btn-primary">View Domains</a>
